<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live — Shankara Srikantan</title>
  <meta name="description" content="Live performances and tour posters by Shankara Srikantan">

  <link rel="icon" href="/media/favicon_letters.png" />
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
  <link rel="stylesheet" href="/styles.css" />
</head>

<script>
    async function loadPartial(id, file){
      const res = await fetch(file);
      document.getElementById(id).innerHTML = await res.text();
    }
    loadPartial('header-slot', '/header.html');
    loadPartial('footer-slot', '/footer.html');
  </script>

<body class="page">

    <div id="header-slot"></div>

  <!-- Live Posters -->
  <div class="live-feed">
    <img class="live-poster" src="/media/ghazalboys.png" alt="The Ghazal Boys" loading="lazy">
    <img class="live-poster" src="/media/masalamixtape.png" alt="Masala Mixtape" loading="lazy">
    <img class="live-poster" src="/media/vinylandbrew.jpeg" alt="Shankara in Chennai" loading="lazy">
    <img class="live-poster" src="/media/Shankara India Tour 2026 Poster.png" alt="Shankara India Tour 2026" loading="lazy">
    <img class="live-poster" src="/media/dstposter.jpg" alt="DST" loading="lazy">
    <img class="live-poster" src="/media/modemhive.jpg" alt="Modem Hive" loading="lazy">
    <img class="live-poster" src="/media/vaazhvekochi.jpg" alt="Vaazhve Kochi" loading="lazy">
    <img class="live-poster" src="/media/nycmehfil.jpeg" alt="NYC Mehfil" loading="lazy">
  </div>

  <div id="footer-slot"></div>

</body>
</html>
