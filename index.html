<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shankara Srikantan</title>

  <meta name="description" content="Official Website of Shankara Srikantan.">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">

  <link rel="stylesheet" type="text/css" href="styles.css" /> 

  <link rel="icon" type="image/x-icon" href="/media/favicon_letters.png">

</head>

<script>
  async function loadPartial(id, file){
    const res = await fetch(file);
    document.getElementById(id).innerHTML = await res.text();
  }
  loadPartial('header-slot', '/header.html');
  loadPartial('footer-slot', '/footer.html');
</script>

<body class="page">
  
  <div id="header-slot"></div>

  <div class="hero">
    <a href="https://song.link/enkadhalum" target="_blank">
      <img src="media/enkadhalum.png" alt="En Kadhalum EP" style="max-width:400px; width:100%; border-radius:6px; transition:opacity 0.2s ease;" onmouseover="this.style.opacity='0.95'" onmouseout="this.style.opacity='1'">
    </a>
  </div>

  <div id="footer-slot"></div>

</body>

</html>
